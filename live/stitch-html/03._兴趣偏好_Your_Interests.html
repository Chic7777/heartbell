    </button>

    <!-- Center: Selection Counter Badge -->

      <span class="text-[12px] font-semibold text-primary" id="selection-counter">8 selected</span>
      <span class="text-[11px] text-ink-primary/50">· min 3</span>
    </div>

    <!-- Bottom-Right: Circular Next Action Button -->

      <button aria-label="Next step: Your Intention" class="flex size-14 items-center justify-center rounded-full bg-primary-container hover:bg-rose-accent active:scale-95 text-ink-primary shadow-lg shadow-primary-container/40 transition-all duration-200" id="next-btn" type="button">
        <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
      </button>
    </div>
  </div></footer>
</main>
<script>
    function updateCounter() {
      const activeCards = document.querySelectorAll('#interests-grid button.card-active').length;
      const counterEl = document.getElementById('selection-counter');
      const nextBtn = document.getElementById('next-btn');
      
      counterEl.textContent = `${activeCards} selected`;
      if (activeCards < 1) {
        nextBtn.classList.add('opacity-50', 'pointer-events-none');
      } else {
        nextBtn.classList.remove('opacity-50', 'pointer-events-none');
      }
    }

    function toggleCard(button) {
      const isSelected = button.classList.contains('card-active');
      const checkIndicator = button.querySelector('.check-indicator');

      if (isSelected) {
        button.classList.remove('card-active', 'ring-2', 'ring-primary');
        checkIndicator.classList.add('hidden');
        checkIndicator.classList.remove('bg-primary');
      } else {
        button.classList.add('card-active', 'ring-2', 'ring-primary');
        checkIndicator.classList.remove('hidden');
        checkIndicator.classList.add('bg-primary');
      }
      updateCounter();
    }

    document.addEventListener('DOMContentLoaded', updateCounter);
  </script>
