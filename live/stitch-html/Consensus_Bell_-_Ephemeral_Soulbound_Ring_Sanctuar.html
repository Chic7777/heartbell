    // SCREEN 18: Onboarding Step 3 - Interests
    function OnboardingInterestsScreen() {
      const navigate = useNavigate();

      const items = [
        "Music", "Travel", "Photography",
        "Coffee & Food", "Reading", "Movies",
        "Art", "Pets", "Sports"
      ];

      const toggle = (item) => {
        if (selected.includes(item)) {
          setSelected(selected.filter((i) => i !== item));
        } else {
          setSelected([...selected, item]);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-[440px] mx-auto bg-surface pb-8 pt-safe">
