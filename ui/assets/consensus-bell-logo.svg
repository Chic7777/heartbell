<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <!-- Consensus Bell Light Monoline Vector Logo (Transparent Background - Ink / Obsidian Minimalist Monoline) -->
  <defs>
    <style>
      .ink-line-main { stroke: #171717; stroke-linecap: round; stroke-linejoin: round; }
      .ink-line-sub { stroke: #594D50; stroke-linecap: round; stroke-linejoin: round; }
      .ink-line-faint { stroke: #8F8285; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fill { fill: #171717; }
      .brand-title { font-family: 'Noto Serif', 'Cinzel', 'Georgia', serif; fill: #171717; font-weight: 500; }
      .brand-sub { font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif; fill: #594D50; letter-spacing: 5px; font-weight: 400; }
    </style>
  </defs>

  <!-- Outer Sacred Geometry Astronomical Circles -->
  <circle cx="400" cy="380" r="310" class="ink-line-faint" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.45"/>
  <circle cx="400" cy="380" r="296" class="ink-line-main" stroke-width="2" opacity="0.85"/>
  <circle cx="400" cy="380" r="282" class="ink-line-sub" stroke-width="1" opacity="0.35"/>

  <!-- Compass Cardinal Dots -->
  <circle cx="400" cy="84" r="3.5" class="ink-fill"/>
  <circle cx="400" cy="676" r="3.5" class="ink-fill"/>
  <circle cx="104" cy="380" r="3" class="ink-fill" opacity="0.75"/>
  <circle cx="696" cy="380" r="3" class="ink-fill" opacity="0.75"/>

  <!-- Top Hanging Finial Eyelet -->
  <circle cx="400" cy="188" r="28" class="ink-line-main" stroke-width="3.5"/>
  <circle cx="400" cy="188" r="16" class="ink-line-sub" stroke-width="1.8"/>

  <!-- Connectors -->
  <line x1="376" y1="210" x2="376" y2="232" class="ink-line-main" stroke-width="3"/>
  <line x1="424" y1="210" x2="424" y2="232" class="ink-line-main" stroke-width="3"/>

  <!-- Cathedral Resonant Bell Silhouette -->
  <path d="M 400 232 
           C 334 232, 284 288, 276 362 
           C 272 408, 270 452, 248 502 
           C 238 524, 216 538, 192 546
           L 192 558
           C 226 560, 282 562, 400 562
           C 518 562, 574 560, 608 558
           L 608 546
           C 584 538, 562 524, 552 502
           C 530 452, 528 408, 524 362
           C 516 288, 466 232, 400 232 Z" 
        class="ink-line-main" stroke-width="4"/>

  <!-- Inner Echo Dashed Contour of Bell -->
  <path d="M 400 248 
           C 346 248, 304 296, 296 360 
           C 292 402, 290 442, 272 488 
           C 264 506, 250 518, 230 528
           C 268 536, 330 542, 400 542
           C 470 542, 532 536, 570 528
           C 550 518, 536 506, 528 488
           C 510 442, 508 402, 504 360
           C 496 296, 454 248, 400 248 Z" 
        class="ink-line-sub" stroke-width="1.6" stroke-dasharray="6 3.5" opacity="0.6"/>

  <!-- Bell Resonant Lip Rim -->
  <path d="M 188 558 C 246 572, 320 578, 400 578 C 480 578, 554 572, 612 558" 
        class="ink-line-main" stroke-width="4.5"/>
  <path d="M 200 568 C 254 580, 324 586, 400 586 C 476 586, 546 580, 600 568" 
        class="ink-line-faint" stroke-width="1.8" opacity="0.55"/>

  <!-- ==================== ETERNITY MOBIUS / TWIN BANDS (CENTER) ==================== -->
  <!-- Primary Outer Mobius Band Loop 1 -->
  <path d="M 400 376
           C 434 326, 486 308, 506 344
           C 528 382, 488 440, 400 490
           C 312 440, 272 382, 294 344
           C 314 308, 366 326, 400 376 Z"
        class="ink-line-main" stroke-width="5.5"/>

  <!-- Secondary Outer Mobius Band Loop 2 -->
  <path d="M 400 430
           C 366 480, 314 498, 294 462
           C 272 424, 312 366, 400 316
           C 488 366, 528 424, 506 462
           C 486 498, 434 480, 400 430 Z"
        class="ink-line-sub" stroke-width="4"/>

  <!-- Internal Alignment Axis -->
  <line x1="346" y1="403" x2="454" y2="403" class="ink-line-faint" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
  <line x1="400" y1="330" x2="400" y2="476" class="ink-line-faint" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>

  <!-- Commitment Facet Nodes -->
  <circle cx="346" cy="403" r="3.5" class="ink-fill"/>
  <circle cx="454" cy="403" r="3.5" class="ink-fill"/>
  <circle cx="400" cy="316" r="3" class="ink-fill"/>
  <circle cx="400" cy="490" r="3" class="ink-fill"/>

  <!-- ==================== DIAMOND CHIME CLAPPER ==================== -->
  <line x1="400" y1="490" x2="400" y2="584" class="ink-line-faint" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="400" cy="587" r="4" class="ink-line-main" stroke-width="2"/>

  <!-- Solitaire Diamond Clapper -->
  <g transform="translate(400, 626)">
    <!-- Outer Rhombus Frame -->
    <polygon points="0,-28 28,0 0,28 -28,0" class="ink-line-main" stroke-width="3.5"/>
    
    <!-- Inner Radiant Facets -->
    <polygon points="0,-16 16,0 0,16 -16,0" class="ink-line-sub" stroke-width="1.5"/>
    <polygon points="0,-7 7,0 0,7 -7,0" class="ink-fill"/>
    
    <!-- Solitaire Sparkle Starburst Rays -->
    <line x1="0" y1="-38" x2="0" y2="38" class="ink-line-main" stroke-width="1.2"/>
    <line x1="-38" y1="0" x2="38" y2="0" class="ink-line-main" stroke-width="1.2"/>
    <line x1="-19" y1="-19" x2="19" y2="19" class="ink-line-faint" stroke-width="0.9" opacity="0.7"/>
    <line x1="19" y1="-19" x2="-19" y2="19" class="ink-line-faint" stroke-width="0.9" opacity="0.7"/>
  </g>

  <!-- ==================== TYPOGRAPHY & BRAND WORDMARK ==================== -->
  <g text-anchor="middle">
    <text x="400" y="722" class="brand-title" font-size="18.5" letter-spacing="9">
      CONSENSUS BELL
    </text>
    <text x="400" y="746" class="brand-sub" font-size="8.5">
      A SHARED SPACE FOR TWO
    </text>
  </g>
</svg>